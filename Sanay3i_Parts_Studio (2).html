<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صنايعي — استوديو القطع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --board:#0E1520;      /* drafting table */
  --board2:#0A0F18;     /* deeper edge */
  --felt:#121B29;       /* raised panels */
  --felt2:#16202F;      /* hover */
  --sheet:#F4EFE4;      /* PAPER — warm cream drawing sheet */
  --sheetedge:#E4DCC9;
  --ink:#1B2431;        /* drawing ink on paper */
  --inkblue:#2C4A63;    /* dimension ink */
  --brass:#C8883A;      /* precision-instrument brass accent */
  --brass2:#E0A552;
  --chalk:#E8EDF4;      /* UI text on board */
  --steel:#93A4BC;      /* muted UI */
  --line:#24334A;       /* hairlines on board */
  --dim:#657891;
  --paperdim:#8A7F68;   /* muted on paper */
  --ok:#4FA97A;
  --warn:#C8883A;
  --mono:'IBM Plex Mono',monospace;
  --sans:'IBM Plex Sans Arabic','IBM Plex Sans',sans-serif;
  --disp:'Fraunces',Georgia,serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 600px at 62% -5%, #16202f 0%, transparent 55%),
    linear-gradient(180deg,var(--board) 0%, var(--board2) 100%);
  color:var(--chalk);font-family:var(--sans);font-size:15px;min-height:100vh;
}
::selection{background:var(--brass);color:#1a1206}

/* ── header ── */
header{display:flex;align-items:center;gap:16px;padding:16px 30px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(18,27,41,.7),transparent);backdrop-filter:blur(4px)}
.mark{display:flex;align-items:baseline;gap:11px}
.mark .logo{font:600 22px/1 var(--disp);letter-spacing:.3px;color:var(--chalk)}
.mark .logo i{color:var(--brass);font-style:normal}
.mark .tag{font:400 11px var(--mono);color:var(--dim);letter-spacing:2px;text-transform:uppercase}
header .grow{flex:1}
.slot{position:relative}
.slot input{width:230px;background:var(--board2);border:1px solid var(--line);border-radius:9px;
  color:var(--chalk);font:500 13.5px var(--sans);padding:9px 13px 9px 34px}
.slot input:focus{outline:none;border-color:var(--brass)}
.slot::before{content:"⌕";position:absolute;inset-inline-start:11px;top:7px;color:var(--dim);font-size:17px}
[dir=rtl] .slot input{padding:9px 34px 9px 13px}
.btn{font:600 13.5px var(--sans);color:var(--chalk);background:var(--felt);
  border:1px solid var(--line);border-radius:9px;padding:9px 15px;cursor:pointer;
  transition:transform .12s,border-color .15s,background .15s}
.btn:hover{border-color:var(--steel);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn.primary{background:linear-gradient(180deg,var(--brass2),var(--brass));border-color:var(--brass);color:#20160a;font-weight:700;
  box-shadow:0 2px 12px rgba(200,136,58,.25)}
.btn.primary:hover{filter:brightness(1.06)}
.gear{width:40px;height:40px;display:grid;place-items:center;padding:0;font-size:17px}

/* settings popover */
.pop{position:absolute;top:64px;inset-inline-end:30px;z-index:50;background:var(--felt);
  border:1px solid var(--line);border-radius:12px;padding:16px;min-width:220px;display:none;
  box-shadow:0 20px 50px rgba(0,0,0,.55)}
.pop.open{display:block}
.pop h4{font:600 12px var(--mono);color:var(--dim);margin-bottom:11px;letter-spacing:1.5px;text-transform:uppercase}
.langrow{display:flex;gap:8px}.langrow button{flex:1}
.langrow .on{border-color:var(--brass);color:var(--brass2)}

/* ── layout ── */
main{display:grid;grid-template-columns:288px 1fr 340px;min-height:calc(100vh - 71px)}
@media(max-width:1180px){main{grid-template-columns:260px 1fr}.tray{display:none}}
@media(max-width:860px){main{grid-template-columns:1fr}nav{display:none}}

/* ── index rail (left ledger) ── */
nav{border-inline-end:1px solid var(--line);padding:18px 14px;overflow-y:auto;
  max-height:calc(100vh - 71px);background:linear-gradient(180deg,rgba(10,15,24,.4),transparent)}
nav::-webkit-scrollbar{width:8px}nav::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.ledger-h{font:600 10.5px var(--mono);color:var(--dim);letter-spacing:2px;margin:20px 8px 9px;
  text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:10px}
.ledger-h span{flex:1}
.ledger-h:first-child{margin-top:2px}
.ledger-h b{color:var(--brass);font-weight:600;font-size:11px}
.part{width:100%;display:flex;align-items:center;gap:12px;text-align:start;background:transparent;
  border:1px solid transparent;border-inline-start:2px solid transparent;border-radius:9px;
  padding:9px 11px;cursor:pointer;color:var(--chalk);font:500 14px var(--sans);position:relative;
  transition:background .12s,border-color .12s}
.part:hover{background:var(--felt)}
.part.on{background:var(--felt);border-color:var(--line);border-inline-start-color:var(--brass)}
.part.on .pname{color:var(--brass2)}
.part svg{flex:none;stroke:var(--steel);fill:none;stroke-width:1.6;transition:stroke .12s}
.part.on svg,.part:hover svg{stroke:var(--brass)}
.part .pname{display:block;line-height:1.25}
.part small{display:block;font:400 10.5px var(--mono);color:var(--dim);margin-top:1px}

/* ── center: the spotlit sheet ── */
.stage{padding:34px 40px 60px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  position:relative;overflow-y:auto;max-height:calc(100vh - 71px)}
.stage::before{content:"";position:absolute;top:-40px;left:50%;transform:translateX(-50%);
  width:680px;height:420px;background:radial-gradient(ellipse at center,rgba(232,224,200,.10),transparent 68%);
  pointer-events:none;z-index:0}
.sheetwrap{position:relative;z-index:1;width:100%;max-width:720px;animation:rise .5s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sheet{background:
    repeating-linear-gradient(0deg,transparent,transparent 43px,rgba(44,74,99,.035) 43px,rgba(44,74,99,.035) 44px),
    repeating-linear-gradient(90deg,transparent,transparent 43px,rgba(44,74,99,.035) 43px,rgba(44,74,99,.035) 44px),
    linear-gradient(180deg,var(--sheet),var(--sheetedge));
  border:1px solid #cfc6b0;border-radius:3px;width:100%;aspect-ratio:760/540;display:block;
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 30px 60px -20px rgba(0,0,0,.65), 0 8px 20px -8px rgba(0,0,0,.4);
  /* paper-scoped ink palette: drawing helpers read these vars, so ink renders on cream */
  --ink:#1B2431; --signal:#255074; --dim:#9C8F73; --steel:#5E6B7E; --line:#C9BFA8;}
.figcap{font:italic 400 15px var(--disp);color:var(--paperdim);margin-top:14px;text-align:center;
  opacity:.85}
.figcap b{color:var(--brass);font-style:normal;font-family:var(--mono);font-size:12px}

/* ── right: instrument tray ── */
.tray{border-inline-start:1px solid var(--line);padding:26px 24px;overflow-y:auto;
  max-height:calc(100vh - 71px);background:linear-gradient(180deg,var(--felt),rgba(18,27,41,.3))}
.tray::-webkit-scrollbar{width:8px}.tray::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.tray h2{font:600 21px/1.15 var(--disp);color:var(--chalk);margin-bottom:3px}
.tray .sub{font:400 11px var(--mono);color:var(--dim);margin-bottom:18px;letter-spacing:.5px}
.dfmwarn{background:linear-gradient(180deg,rgba(200,136,58,.12),rgba(200,136,58,.05));
  border:1px solid rgba(200,136,58,.4);border-radius:10px;padding:11px 13px;margin-bottom:16px;
  font:500 12.5px var(--sans);color:var(--brass2);line-height:1.55}
.dfmwarn b{color:var(--brass2)}
.field{margin-bottom:12px}
.field label{display:flex;justify-content:space-between;align-items:baseline;
  font:500 12.5px var(--sans);color:var(--steel);margin-bottom:6px}
.field label code{font:500 11px var(--mono);color:var(--dim);letter-spacing:.5px}
.field .inwrap{position:relative}
.field input{width:100%;background:var(--board2);border:1px solid var(--line);border-radius:9px;
  color:var(--chalk);font:600 15px var(--mono);padding:10px 40px 10px 13px;direction:ltr;text-align:left;
  transition:border-color .15s}
.field input:focus{outline:none;border-color:var(--brass)}
.field input.bad{border-color:#c8452e}
.field .unit{position:absolute;right:12px;top:11px;font:500 11px var(--mono);color:var(--dim);pointer-events:none}
.hint{font:400 11.5px var(--sans);color:#d9834f;min-height:14px;margin-top:4px}
.actions{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}
.actions .btn{flex:1;min-width:0}
/* ═══ Bridge (send to SolidWorks) ═══ */
.btn.bridge{background:linear-gradient(180deg,var(--brass2),var(--brass));color:#1a1206;font-weight:700;
  border:1px solid rgba(0,0,0,.25);box-shadow:0 2px 10px rgba(200,136,58,.35)}
.btn.bridge:hover{filter:brightness(1.07)}
.btn.bridge:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.bridgestatus{font:400 11px var(--mono);margin-top:7px;line-height:1.6;min-height:14px}
.bridgestatus.ok{color:var(--ok)}
.bridgestatus.off{color:var(--dim)}
.bridgestatus code{background:var(--felt2);padding:1px 6px;border-radius:4px;color:var(--chalk);
  user-select:all;cursor:pointer}
.bmodal-wrap{position:fixed;inset:0;background:rgba(8,12,20,.72);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.bmodal{background:var(--felt);border:1px solid var(--line);border-radius:14px;max-width:560px;width:100%;
  padding:26px;box-shadow:0 24px 70px rgba(0,0,0,.5);max-height:85vh;overflow:auto}
.bmodal h3{font:700 17px var(--sans);color:var(--brass2);margin-bottom:4px}
.bmodal-sub{font:400 12.5px var(--sans);color:var(--steel);margin-bottom:14px;line-height:1.6}
.bmodal-cmds{background:var(--board2);border:1px solid var(--line);border-radius:9px;padding:13px 15px;
  font:400 12px var(--mono);color:var(--chalk);max-height:240px;overflow:auto;line-height:1.85}
.bmodal-cmds .op{color:var(--brass2);font-weight:600}
.bmodal-cmds .pv{color:var(--steel)}
.bmodal-result{margin-top:13px;padding:12px 15px;border-radius:9px;font:400 12.5px var(--sans);line-height:1.6}
.bmodal-result.ok{background:rgba(79,169,122,.12);border:1px solid rgba(79,169,122,.4);color:var(--ok)}
.bmodal-result.err{background:rgba(200,69,46,.1);border:1px solid rgba(200,69,46,.4);color:#e08876}
.bmodal-actions{display:flex;gap:10px;margin-top:16px;justify-content:flex-end}
.bmodal-actions .btn{min-width:110px}
.icobtn{flex:0 0 auto!important;width:44px;padding:10px 0;font-size:17px}
.icobtn.on{border-color:var(--brass);color:var(--brass2)}
.preset-row{display:flex;gap:8px;margin-top:12px}
.preset-row input{flex:1;background:var(--board2);border:1px solid var(--line);border-radius:9px;
  color:var(--chalk);font:500 13px var(--sans);padding:9px 12px}
.preset-row input:focus{outline:none;border-color:var(--brass)}
.preset-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.preset-chip{display:inline-flex;align-items:center;gap:7px;background:var(--board2);
  border:1px solid var(--line);border-radius:20px;padding:5px 8px 5px 13px;font:500 12px var(--sans);
  color:var(--steel);cursor:pointer;transition:border-color .12s,color .12s}
.preset-chip:hover{border-color:var(--brass);color:var(--chalk)}
.preset-chip b{color:var(--brass2);font-weight:600}
.preset-chip .x{color:var(--dim);font-size:14px;padding:0 2px;line-height:1}
.preset-chip .x:hover{color:#c8452e}
.soon{font:400 11.5px var(--sans);color:var(--dim);text-align:center;margin-top:16px;line-height:1.5;
  padding-top:14px;border-top:1px solid var(--line)}

/* json drawer under sheet */
.jsonwrap{width:100%;max-width:720px;margin-top:22px;z-index:1}
details{background:var(--felt);border:1px solid var(--line);border-radius:12px;overflow:hidden}
summary{cursor:pointer;padding:14px 18px;font:500 12px var(--mono);color:var(--steel);
  letter-spacing:1px;list-style:none;display:flex;align-items:center;gap:11px;text-transform:uppercase}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";color:var(--brass);transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
pre{padding:4px 18px 18px;font:400 12.5px/1.7 var(--mono);color:#b9c6da;overflow-x:auto;
  direction:ltr;text-align:left}

.toast{position:fixed;bottom:28px;inset-inline-start:50%;transform:translateX(-50%);
  background:var(--felt);border:1px solid var(--ok);color:var(--chalk);font:500 14px var(--sans);
  padding:11px 22px;border-radius:11px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99;
  box-shadow:0 12px 30px rgba(0,0,0,.5)}
[dir="rtl"] .toast{transform:translateX(50%)}
.toast.show{opacity:1}
.batchbar{position:fixed;bottom:0;inset-inline:0;background:linear-gradient(180deg,var(--felt),var(--board));
  border-top:1px solid var(--brass);display:none;align-items:center;gap:13px;padding:13px 30px;z-index:60;
  box-shadow:0 -10px 34px rgba(0,0,0,.5)}
.batchbar.show{display:flex}
.batchbar span{font:600 13.5px var(--sans);color:var(--chalk)}
.viewtabs{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.vtab{background:var(--felt);border:1px solid var(--line);color:var(--steel);border-radius:7px;
  padding:6px 16px;font:600 13px var(--mono);cursor:pointer}
.vtab.on{background:var(--brass);border-color:var(--brass);color:#1a1206}
.btn.mini{width:38px;height:34px;padding:0;font-size:15px}

/* ---- light theme (board turns to a light workbench; paper stays paper) ---- */
body.light{--board:#E8ECF2;--board2:#DDE3EC;--felt:#F1F4F9;--felt2:#E7ECF3;
  --chalk:#1A2432;--steel:#556880;--line:#C6D0DE;--dim:#8493A6;
  background-image:radial-gradient(circle,#d2dae6 1px,transparent 1px)!important;}
body.light header{background:linear-gradient(180deg,#fff,#E8ECF2)!important}
body.light .btn{background:#DEE4EE}
body.light .part:hover,body.light .part.on,body.light .pop,body.light details,body.light pre{background:#E7ECF3}
.batchbar .bcount{font:600 12px var(--mono);color:var(--brass2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ═══════ Arabic typography layer — connected, dignified ═══════
   Arabic breaks with letter-spacing and Latin display fonts.
   These overrides give the RTL UI the same polish as English. */
[dir="rtl"] .tag{font-family:var(--sans);letter-spacing:0;font-size:12.5px;font-weight:500}
[dir="rtl"] .ledger-h{font-family:var(--sans);letter-spacing:0;font-size:13px;font-weight:700;text-transform:none}
[dir="rtl"] .ledger-h b{font-family:var(--mono);font-size:11px}
[dir="rtl"] .tray h2{font-family:var(--sans);font-weight:700;letter-spacing:0;font-size:20px}
[dir="rtl"] .figcap{font-family:var(--sans);font-style:normal;font-size:14px;letter-spacing:0}
[dir="rtl"] summary{font-family:var(--sans);letter-spacing:0;text-transform:none;font-size:13px;font-weight:600}
[dir="rtl"] .pop h4{font-family:var(--sans);letter-spacing:0;text-transform:none;font-size:12.5px}
[dir="rtl"] .dfmwarn{font-size:13px;line-height:1.7}
[dir="rtl"] .field label{font-size:13px}
[dir="rtl"] .preset-chip{font-size:12.5px}
[dir="rtl"] .batchbar span{font-size:14px}
.actions .btn{white-space:nowrap}
[dir="rtl"] .part .pname{font-size:14.5px;font-weight:600}
[dir="rtl"] .soon{font-size:12px}

/* ═══════ Shop Tools drawer ═══════ */
.tdscrim{position:fixed;inset:0;background:rgba(6,10,18,.55);backdrop-filter:blur(2px);
 opacity:0;pointer-events:none;transition:opacity .2s;z-index:70}
.tdscrim.open{opacity:1;pointer-events:auto}
.tooldrawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(460px,94vw);z-index:71;
 background:linear-gradient(180deg,var(--felt),var(--board));border-inline-start:1px solid var(--brass);
 box-shadow:-20px 0 60px rgba(0,0,0,.5);transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.7,.2,1);
 display:flex;flex-direction:column}
[dir="rtl"] .tooldrawer{transform:translateX(-100%)}
.tooldrawer.open{transform:translateX(0)!important}
.tooldrawer-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;
 border-bottom:1px solid var(--line)}
.tooldrawer-head b{font:700 17px var(--sans);color:var(--chalk)}
.tooltabs{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ttab{font:600 12px var(--sans);color:var(--steel);background:var(--board2);border:1px solid var(--line);
 border-radius:18px;padding:7px 13px;cursor:pointer;transition:.12s}
.ttab:hover{border-color:var(--steel)}
.ttab.on{border-color:var(--brass);color:var(--brass2);background:rgba(200,136,58,.08)}
.toolbody{flex:1;overflow-y:auto;padding:18px 20px}
.toolbody::-webkit-scrollbar{width:8px}.toolbody::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.tcard{background:var(--board2);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:14px}
.tcard h4{font:700 14px var(--sans);color:var(--chalk);margin-bottom:10px}
.trow{display:flex;gap:9px;margin-bottom:9px;flex-wrap:wrap}
.trow>*{flex:1;min-width:90px}
.tsel,.tin{background:var(--felt);border:1px solid var(--line);border-radius:8px;color:var(--chalk);
 font:600 13.5px var(--mono);padding:8px 10px}
.tsel{font-family:var(--sans);font-weight:600}
.tin{direction:ltr;text-align:left}
.tsel:focus,.tin:focus{outline:none;border-color:var(--brass)}
.tres{background:linear-gradient(180deg,rgba(200,136,58,.10),rgba(200,136,58,.04));
 border:1px solid rgba(200,136,58,.35);border-radius:10px;padding:11px 13px;
 font:600 14px var(--mono);color:var(--brass2);line-height:1.7;direction:ltr;text-align:left}
[dir="rtl"] .tres{direction:rtl;text-align:right}
.tres .big{font-size:19px;color:var(--chalk)}
.tres small{display:block;font:500 11.5px var(--sans);color:var(--steel);margin-top:4px;direction:inherit}
.ttable{width:100%;border-collapse:collapse;font:500 12.5px var(--mono);color:var(--chalk);direction:ltr}
.ttable th{font:600 11px var(--sans);color:var(--dim);text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}
.ttable td{padding:5px 8px;border-bottom:1px solid rgba(36,51,74,.5)}
.ttable tr:hover td{background:rgba(200,136,58,.05)}
.tnote{font:500 11.5px var(--sans);color:var(--dim);margin-top:8px;line-height:1.55}
</style>
</head>
<body>

<header>
  <div class="mark">
    <span class="logo">Sanay<i>3</i>i</span>
    <span class="tag" id="tagline">drafting studio</span>
  </div>
  <div class="grow"></div>
  <div class="slot"><input id="q" placeholder="ابحث عن قطعة…"></div>
  <button class="btn" id="toolsBtn">🧰 <span id="toolsBtnT">عدة الورشة</span></button>
  <button class="btn primary" id="genBtn">توليد الأوامر</button>
  <button class="btn gear" id="themeBtn" aria-label="theme" title="فاتح/غامق">◐</button>
  <button class="btn gear" id="gearBtn" aria-label="settings">⚙</button>
</header>

<div class="tooldrawer" id="tooldrawer">
 <div class="tooldrawer-head">
   <b id="tdTitle">🧰 عدة الورشة</b>
   <button class="btn gear" id="tdClose">✕</button>
 </div>
 <div class="tooltabs" id="tooltabs"></div>
 <div class="toolbody" id="toolbody"></div>
</div>
<div class="tdscrim" id="tdscrim"></div>

<div class="pop" id="pop">
  <h4>اللغة / Language</h4>
  <div class="langrow">

/* ============ svg helpers ============ */
const NS="http://www.w3.org/2000/svg";
function el(t,a,x){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(x!=null)e.textContent=x;return e;}
function line(g,x1,y1,x2,y2,st,w){g.appendChild(el("line",{x1,y1,x2,y2,stroke:st||"var(--ink)","stroke-width":w||1.4}));}

/* --- reusable SVG defs: ISO filled arrowheads, section hatch, sheet shadow --- */
function svgDefs(){
 const d=el("defs",{});
 // filled arrowheads (closed, 15° ISO style) — one per direction, drawn AT the witness line
 const heads={ar_r:"M0 0 L9 3 L9 -3 Z",ar_l:"M0 0 L-9 3 L-9 -3 Z",ar_u:"M0 0 L3 -9 L-3 -9 Z",ar_d:"M0 0 L3 9 L-3 9 Z"};
 // 45° section hatch pattern (thin ink lines)
 const pat=el("pattern",{id:"hatch45",width:7,height:7,patternUnits:"userSpaceOnUse",patternTransform:"rotate(45)"});
 pat.appendChild(el("line",{x1:0,y1:0,x2:0,y2:7,stroke:"var(--inkblue)","stroke-width":.6,opacity:.55}));
 d.appendChild(pat);
 // soft paper shadow under the frame
 const f=el("filter",{id:"paperShadow",x:"-4%",y:"-4%",width:"108%",height:"108%"});
 f.appendChild(el("feDropShadow",{dx:0,dy:2,stdDeviation:3,"flood-color":"#000","flood-opacity":.12}));
 d.appendChild(f);
 return d;
}
// filled arrowhead at (x,y) pointing in direction dir (l/r/u/d)
function ahead(g,x,y,dir){
 const p={l:"M0 0 L9 3.2 L9 -3.2 Z",r:"M0 0 L-9 3.2 L-9 -3.2 Z",u:"M0 0 L3.2 9 L-3.2 9 Z",d:"M0 0 L3.2 -9 L-3.2 -9 Z"}[dir];
 g.appendChild(el("path",{d:p,transform:`translate(${x} ${y})`,fill:"var(--inkblue)",stroke:"none"}));}
function arrow(g,x,y,d){ahead(g,x,y,d);} // back-compat alias, now filled
// witness (extension) line — thin, with small gap from the part
function witness(g,x1,y1,x2,y2){line(g,x1,y1,x2,y2,"var(--inkblue)",.7);}
function dimH(g,x1,x2,y,label){
 witness(g,x1,y-5,x1,y+7);witness(g,x2,y-5,x2,y+7);
 line(g,x1,y,x2,y,"var(--inkblue)",.9);ahead(g,x1,y,"l");ahead(g,x2,y,"r");
 // pill behind label so the dim line doesn't cut the text
 const cx=(x1+x2)/2;g.appendChild(el("rect",{x:cx-(String(label).length*3.5+3),y:y-14,width:String(label).length*7+6,height:12,fill:"var(--sheet)",stroke:"none",rx:2}));
 txt(g,cx,y-5,label,11.5,"var(--inkblue)");}
function dimV(g,y1,y2,x,label){
 witness(g,x-7,y1,x+5,y1);witness(g,x-7,y2,x+5,y2);
 line(g,x,y1,x,y2,"var(--inkblue)",.9);ahead(g,x,y1,"u");ahead(g,x,y2,"d");
 const cy=(y1+y2)/2;g.appendChild(el("rect",{x:x+4,y:cy-7,width:String(label).length*7+5,height:13,fill:"var(--sheet)",stroke:"none",rx:2}));
 g.appendChild(el("text",{x:x+7,y:cy+2.5,fill:"var(--inkblue)","font-family":"IBM Plex Mono, IBM Plex Sans Arabic, monospace","font-size":11.5,"text-anchor":"start"},label));}
// radial / diameter dimension with leader out of a circle
function radial(g,cx,cy,r,label,ang){
 const a=(ang==null?-40:ang)*Math.PI/180,ex=cx+Math.cos(a)*r,ey=cy+Math.sin(a)*r;
 const lx=cx+Math.cos(a)*(r+26),ly=cy+Math.sin(a)*(r+26);
 line(g,ex,ey,lx,ly,"var(--inkblue)",.9);ahead(g,ex,ey,Math.cos(a)>0?"r":"l");
 const tx=lx+(Math.cos(a)>0?4:-4);
 g.appendChild(el("text",{x:tx,y:ly+3.5,fill:"var(--inkblue)","font-family":"IBM Plex Mono, IBM Plex Sans Arabic, monospace","font-size":11,"text-anchor":Math.cos(a)>0?"start":"end"},label));}

function leader(g,px,py,tx,ty,label,anchor){

/* ============ ISO frame + title block ============ */

 "ABCD".split("").forEach((c,i)=>{const yy=90+i*120;txt(g,18,yy,c,10,"var(--dim)");txt(g,742,yy,c,10,"var(--dim)");
   if(i>0){thin(g,22,yy-60,28,yy-60);thin(g,732,yy-60,738,yy-60);}});
 [1,2,3,4,5,6].forEach((n,i)=>{const xx=80+i*120;txt(g,xx,19,n,10,"var(--dim)");txt(g,xx,534,n,10,"var(--dim)");
   if(i>0){thin(g,xx-60,22,xx-60,28);thin(g,xx-60,510,xx-60,516);}});
 const T=I18N[lang].tb,x=406,y=416,w=332,h=88;
 // panel
 g.appendChild(el("rect",{x,y,width:w,height:h,fill:"rgba(37,80,116,0.045)",stroke:"var(--ink)","stroke-width":1.4}));
 // row + column rules
 const th=(a,b,c,d)=>thin(g,a,b,c,d);
 th(x,y+22,x+w,y+22);            // under title row
 th(x,y+46,x+w,y+46);            // under name row
 th(x,y+67,x+w,y+67);            // under spec row
 th(x+168,y,x+168,y+22);         // title | rev split
 th(x+112,y+46,x+112,y+67);      // scale | units
 th(x+220,y+46,x+220,y+67);      // units | proj
 th(x+112,y+67,x+112,y+h);       // by | date
 th(x+232,y+67,x+232,y+h);       // date | code

 txt(g,x+8,y+34,(lang==="ar"?"الخامة: ":"MAT: ")+(part.mat||(lang==="ar"?"فولاذ C45":"Steel C45")),9.5,"var(--steel)","start");
 txt(g,x+120,y+34,(lang==="ar"?"التشطيب: Ra 3.2":"FINISH: Ra 3.2"),9.5,"var(--steel)","start");
 txt(g,x+240,y+34,(lang==="ar"?"سماح ±0.1":"TOL ±0.1"),9.5,"var(--steel)","start");
 // scale / units / third-angle projection symbol
 txt(g,x+8,y+60,T.scale+" 1:1",10,"var(--steel)","start");
 txt(g,x+120,y+60,T.units+": mm",10,"var(--steel)","start");
 projSymbol(g,x+284,y+56);

 txt(g,x+8,y+79,T.by,9,"var(--dim)","start");
 txt(g,x+8,y+87,"Sanay3i",10,"var(--brass)","start");
 g.lastChild.setAttribute("font-weight","600");
 txt(g,x+58,y+87,"/ Eng. Osama",9.5,"var(--steel)","start");
 txt(g,x+120,y+79,T.date,9,"var(--dim)","start");
 txt(g,x+120,y+87,new Date().toISOString().slice(0,10),9.5,"var(--steel)","start");
 txt(g,x+240,y+79,lang==="ar"?"الرمز":"CODE",9,"var(--dim)","start");
 txt(g,x+240,y+87,part.code,11,"var(--ink)","start");
 g.lastChild.setAttribute("font-weight","600");
 // code tab above panel
 txt(g,x+8,y-8,part.code+"  ·  "+part.name.en,10,"var(--dim)","start");

// ISO third-angle projection symbol (truncated cone: circle + trapezoid)
function projSymbol(g,cx,cy){

 path(g,`M${cx+3} ${cy-r} L${cx+16} ${cy-r*0.55} L${cx+16} ${cy+r*0.55} L${cx+3} ${cy+r} Z`,"var(--ink)",1.1);

}

 const w=[];const has=k=>k in v;const g=k=>v[k];
 const ar=lang==="ar";
 // collect all "outer envelope" candidates and all "hole/inner" candidates by naming
 const outerKeys=part.params.map(p=>p.k).filter(k=>/^(OD|D|D1|D2|L|W|A|B|bw|bd|s|H|hd)$/.test(k));
 const innerKeys=part.params.map(p=>p.k).filter(k=>/^(ID|id|b|Bb|sb|pd|cb)$/.test(k));
 // 1) any inner dimension >= the smallest relevant outer dimension
 innerKeys.forEach(ik=>{
   if(!has(ik))return;
   // find a sensible outer companion
   let pair=null;
   if(ik==="ID"&&has("OD"))pair="OD";
   else if((ik==="b"||ik==="id")&&has("OD"))pair="OD";
   else if((ik==="b")&&has("D"))pair="D";
   else if(ik==="B"&&has("bw"))pair="bw";
   else if(ik==="Bb"&&has("BD"))pair="BD";
   else if(ik==="sb"&&has("bd"))pair="bd";
   else if(ik==="pd"&&has("D"))pair="D";
   if(pair&&g(ik)>=g(pair))w.push((ar?"القطر الداخلي ":"Inner ")+ik+"="+g(ik)+" ≥ "+pair+"="+g(pair));
 });
 // 2) hole vs plate envelope (through-hole must fit)
 const holeK=part.params.find(p=>/^d$/.test(p.k)||/hole/i.test(p.ar+p.en));
 if(holeK&&has(holeK.k)){["L","W","B","bw","A"].forEach(k=>{if(has(k)&&g(holeK.k)>=g(k))w.push((ar?"الثقب ":"Hole ")+g(holeK.k)+(ar?" أكبر من ":" ≥ ")+k+"="+g(k));});}
 // 3) edge margin vs hole radius
 if(has("m")&&holeK&&has(holeK.k)&&g("m")<g(holeK.k)/2)w.push(ar?"إزاحة الحافة أصغر من نصف قطر الثقب — خطر كسر":"Edge margin < hole radius — blowout risk");
 // 4) bolt circle must sit inside OD and outside bore
 if(has("BCD")){if(has("OD")&&g("BCD")>=g("OD"))w.push(ar?"دائرة البراغي ≥ القطر الخارجي":"BCD ≥ OD");
   if(has("ID")&&g("BCD")<=g("ID"))w.push(ar?"دائرة البراغي ≤ القطر الداخلي":"BCD ≤ ID");
   if(has("bd")&&has("OD")&&g("BCD")+g("bd")>=g("OD"))w.push(ar?"ثقوب البراغي بتتجاوز الحافة الخارجية":"Bolt holes cross outer edge");}
 // 5) counterbore/pocket depth vs thickness
 if(has("cd")&&has("T")&&g("cd")>=g("T"))w.push(ar?"عمق الغطس ≥ السماكة":"Counterbore depth ≥ thickness");
 if(has("bh")&&has("H")&&g("bh")>=g("H"))w.push(ar?"عمق التجويف ≥ الارتفاع":"Bore depth ≥ height");
 // groove depth vs width only when groove is radial (has gw width partner), skip axial grooves
 if(has("gd")&&has("gw")&&g("gd")>=g("gw")*4)w.push(ar?"عمق الحز كبير جداً بالنسبة لعرضه":"Groove very deep vs width");
 // 6) stepped diameters sanity (d1<d2 expected order not enforced, but equal is suspicious)
 if(has("d1")&&has("d2")&&g("d1")===g("d2"))w.push(ar?"قطرا الدرجتين متساويان — لا توجد درجة":"Both step diameters equal — no step");
 // 7) slot geometry
 if(has("sl")&&has("sw")&&g("sw")>=g("sl"))w.push(ar?"عرض الفتحة ≥ طولها — مش فتحة":"Slot width ≥ length — not a slot");
 if(has("sl")&&has("L")&&g("sl")>=g("L"))w.push(ar?"الفتحة أطول من القطعة":"Slot longer than part");
 // 8) gear undercut
 if(has("z")&&g("z")<17&&(!has("pa")||g("pa")>=20))w.push(ar?"عدد الأسنان <17 — احتمال undercut (تدنية سفلية)":"z<17 — undercut likely");
 if(has("z1")&&g("z1")<17)w.push(ar?"الترس الصغير <17 سن — undercut":"Pinion z1<17 — undercut");
 // 9) wall thickness left after bore
 if(has("OD")&&has("ID")&&(g("OD")-g("ID"))/2<1.5)w.push(ar?"سماكة الجدار <1.5مم — ضعيفة":"Wall <1.5mm — fragile");
 if(has("OD")&&has("b")&&(g("OD")-g("b"))/2<1.5)w.push(ar?"سماكة الجدار <1.5مم — ضعيفة":"Wall <1.5mm — fragile");
 // 10) very thin sheet flag (informational)
 if(has("T")&&g("T")<1)w.push(ar?"سماكة أقل من 1مم — تحقق من التصنيع":"Thickness <1mm — verify process");
 return [...new Set(w)];
}

/* ═══════════ BRIDGE: catalog → SolidWorks engine ═══════════
   Talks to the local Sanay3i engine (swpilot bridge) via the
   two-step contract: POST /v1/commandfile (preview+token) →
   user confirms → POST /v1/execute {token}. Localhost only. */
/* Same-origin when served by the bridge itself (http://127.0.0.1:8765/),
   which avoids CORS entirely. From file:// we still try localhost, but
   browsers block that — so the status line guides the user to the URL. */
const BRIDGE_SAME_ORIGIN=location.protocol==="http:"||location.protocol==="https:";
const BRIDGE_BASE=BRIDGE_SAME_ORIGIN?"":"http://127.0.0.1:8765";
let bridgeUp=false, bridgeInfo=null, _pendingToken=null;

/* ═══ swTranslate: catalog dialect → engine schema (v0.5) ═══
   The engine (pydantic, extra="forbid") accepts an exact vocabulary.
   This translator rewrites every command file the catalog emits into
   that vocabulary, so ALL outputs (bridge, download, copy) are valid
   engine CommandFiles. Facts it encodes (verified against schema.py):
   • front plane normal = +Z → cylinders sketch on "front", extrude +Z
   • FaceRef = {facing, of_feature?}; of_feature optional → default
     "last boss" (catalog feature names don't exist engine-side → drop)
   • hole.at = [[x,y],…]; cb fields = cb_diameter/cb_depth
   • draw_slot start/end are the END-ARC CENTERS (len = |e-s| + width)
   • revolve/revolve_cut need create_axis first; axis must lie in plane
   • strip fields the engine forbids (name on plate/extrude/cut, sketch
     refs on draw_*, etc.)                                            */
const _FIELD_OK={ // per-op whitelist of fields the engine accepts (op excluded)
 new_part:["name"],new_assembly:["name"],
 create_sketch:["plane","on"],draw_circle:["center","diameter"],
 draw_rectangle:["center","width","height"],draw_slot:["start","end","width"],
 draw_line:["start","end","kind"],extrude:["depth","reverse"],
 cut_extrude:["through_all","depth","reverse","draft_angle"],
 revolve:["axis","angle","reverse"],revolve_cut:["axis","angle","reverse"],
 helix_thread:["diameter","pitch","length","right_handed","on_feature"],
 hole:["at","type","standard","diameter","cb_diameter","cb_depth","cs_diameter","cs_angle","on"],
 create_plate:["width","height","thickness","plane"],
 create_plane:["name","offset_from","distance"],create_axis:["axis"],
 chamfer:["distance","angle","edges"],fillet:["radius","edges"],
 linear_pattern:["features","direction","spacing","count","direction2"],
 circular_pattern:["features","axis","count","total_angle","equal_spacing"],
 add_corner_holes:["diameter","margin"],save_part:["path"],save_assembly:["path"],
 insert_component:["part","file","envelope","name","at","rotate","fixed"],
 mate:["type","a","b","value"],
 involute_spur_gear:["module","teeth","pressure_angle","face_width","bore","hub_diameter","hub_length","keyway","name"],
 internal_ring_gear:["module","teeth","face_width","rim_outer_diameter","name"],
 sprocket_iso:["chain","teeth","face_width","bore","keyway","name"],
};
function _faceRef(on,nameMap){ // on:{face:{of_feature,facing}} → FaceRef ; on:{plane:name} → {__plane}
 if(on==null)return undefined;
 if(typeof on==="string")return undefined;
 if(on.plane)return {__plane:on.plane};
 const f=on.face||on;
 if(f&&f.facing){
   const r={facing:f.facing};
   if(nameMap&&f.of_feature&&nameMap[f.of_feature])r.of_feature=nameMap[f.of_feature];
   return r;
 }
 return undefined;
}
function _clean(op,cmd){ // keep only fields the engine accepts for this op
 const ok=_FIELD_OK[op]||[]; const out={op};
 for(const k of ok) if(cmd[k]!==undefined) out[k]=cmd[k];
 return out;
}
function _atList(at){ // "center" | {u,v} | {r,theta_deg} | [x,y] | [[x,y],…] → [[x,y],…]
 if(at==null||at==="center")return [[0,0]];
 if(Array.isArray(at))return (Array.isArray(at[0])?at:[at]);
 if(typeof at==="object"){
   if(at.r!=null){const th=(at.theta_deg||0)*Math.PI/180;return [[+(at.r*Math.cos(th)).toFixed(4),+(at.r*Math.sin(th)).toFixed(4)]];}
   return [[at.u||0,at.v||0]];
 }
 return [[0,0]];
}
function _edgesClean(e){ // drop catalog feature names from edge selectors → default resolution
 if(e==null)return e;
 if(typeof e==="object"){const o={...e};delete o.of_feature;return o;}
 return e;
}
function _dir(d){ // catalog "+x" → engine "x" ; "-x" stays
 if(!d)return d; return d[0]==="+"?d.slice(1):d;
}
const _PLANE_MAP={bottom:["top",-1],back:["front",-1],left:["right",-1]};
function swTranslate(cmdfile){
 const src=(cmdfile&&cmdfile.commands)||[];
 const out=[]; const notes=[]; let axes=new Set(); let sawPart=false, sawSolid=false;
 let bossN=0, cutN=0;
 const nameMap={};
 let lastFaceSign=null;
 let plate=null;
 let sk=null;
 const planeSign={};                   // مستويات منشأة: إشارة المسافة (لعكس القص)
 const comps=[];                       // القطع المُدرجة بالتجميع (لتركيب mate)
 swTranslate._ic={};                   // عداد النسخ لكل قطعة (pinion_1, wheel_1…)
 let pend=[];                          // كيانات السكتش الحالية (لتضخيم القص الممتد بكامل البعد)
 const off=(x,y)=>plate?[x-plate.w/2,y-plate.h/2]:[x,y];
 const offAt=(lst)=>lst.map(([x,y])=>off(x,y));
 const ensurePart=()=>{ if(!sawPart){out.push({op:"new_part"});sawPart=true;} };
 const ensureAxis=(ax)=>{ if(!axes.has(ax)){out.push({op:"create_axis",axis:ax});axes.add(ax);} };
 const addBoss=(catName)=>{bossN++;if(catName)nameMap[catName]="Boss-Extrude"+bossN;};
 const addCut=(catName,n)=>{cutN+=(n||1);if(catName)nameMap[catName]="Cut-Extrude"+cutN;};
 const featName=(cat)=>nameMap[cat]||("Cut-Extrude"+cutN);
 const _fixRevolvePlane=(ax)=>{ // محور التدوير لازم داخل مستوى السكتش
   if(!sk)return;
   const normalOf={front:"z",top:"y",right:"x"};
   if(normalOf[sk.family]!==ax)return;      // سليم أصلاً
   if(ax!=="z")return;                       // الكتالوج بيستعمل z بس
   out[sk.outIdx]={op:"create_sketch",plane:"right"}; // right يحوي z
   for(const i of sk.ents){ const e=out[i];  // (x,y)→(u,v)=(-y,x)
     const T=p=>[-p[1],p[0]];
     if(e.start){e.start=T(e.start);e.end=T(e.end);}
     if(e.center)e.center=T(e.center);
   }
   sk.family="right";
 };
 const flushCutInflate=()=>{ // قص مستطيل بيمتد بكامل بُعد الصفيحة → ضخّمه 1mm ليقطع فعلاً
   if(!plate)return;
   for(const e of pend){
     if(e.op==="draw_rectangle"){
       if(Math.abs(e.width -plate.w)<0.01)e.width =plate.w+2;
       if(Math.abs(e.height-plate.h)<0.01)e.height=plate.h+2;
     }
   }
 };
 for(const c of src){
  const op=c.op;
  switch(op){
   case "new_part": case "new_assembly": sawPart=true; out.push(_clean(op,c)); break;
   case "create_plate": ensurePart(); out.push(_clean(op,c)); sawSolid=true; addBoss(c.name);
     plate={w:c.width,h:c.height}; lastFaceSign=null; pend=[]; break;
   case "create_cylinder": {
     ensurePart();
     out.push({op:"create_sketch",plane:"front"});
     out.push({op:"draw_circle",diameter:c.diameter});
     out.push({op:"extrude",depth:c.height});
     sawSolid=true; addBoss(c.name); plate=null; lastFaceSign=null; pend=[]; break; }
   case "create_cone": {
     ensurePart(); ensureAxis("z");
     const h=c.height;
     out.push({op:"create_sketch",plane:"right"});
     if(c.base_diameter!=null){ // مخروط مقطوع مصمت: قاعدة R1 → قمة R2
       const R1=c.base_diameter/2, R2=c.top_diameter!=null?c.top_diameter/2:0.5;
       out.push({op:"draw_line",start:[0,0],end:[0,R1]});
       out.push({op:"draw_line",start:[0,R1],end:[-h,R2]});
       out.push({op:"draw_line",start:[-h,R2],end:[-h,0]});
       out.push({op:"draw_line",start:[-h,0],end:[0,0]});
     }else{ // وردة/جدار مخروطي: {outer,inner,wall}
       const Ro=c.outer_diameter/2, Ri=c.inner_diameter/2, t=c.wall||Math.max(1,(Ro-Ri)*0.15);
       out.push({op:"draw_line",start:[0,Ri],end:[0,Ro]});
       out.push({op:"draw_line",start:[0,Ro],end:[-h,Ri+t]});
       out.push({op:"draw_line",start:[-h,Ri+t],end:[-h,Ri]});
       out.push({op:"draw_line",start:[-h,Ri],end:[0,Ri]});
     }
     out.push({op:"revolve",axis:"z"});
     sawSolid=true; addBoss(c.name); plate=null; pend=[]; break; }
   case "cut": {
     flushCutInflate();
     const cc={op:"cut_extrude"};
     if(c.depth!=null){cc.through_all=false;cc.depth=c.depth;} else cc.through_all=true;
     if(lastFaceSign==="+")cc.reverse=true;
     if(c.reverse)cc.reverse=!cc.reverse;
     out.push(cc); addCut(c.name); pend=[]; break; }
   case "slot": {
     const onRef=_faceRef(c.on,nameMap);
     out.push(onRef?{op:"create_sketch",on:onRef}:{op:"create_sketch",plane:"front"});
     const L=c.length,W=c.width;
     const [cx,cy]=off((c.at&&c.at.u)||0,(c.at&&c.at.v)||0);
     const half=(L-W)/2;
     out.push({op:"draw_slot",start:[cx-half,cy],end:[cx+half,cy],width:W});
     const cc={op:"cut_extrude"};
     if(c.through===false&&c.depth!=null){cc.through_all=false;cc.depth=c.depth;}
     if(onRef&&onRef.facing&&onRef.facing[0]==="+")cc.reverse=true;
     out.push(cc); addCut(c.name); lastFaceSign=null; pend=[]; break; }
   case "cb_hole": {
     const h={op:"hole",type:"counterbore",diameter:c.hole_dia,
              cb_diameter:c.cbore_dia,cb_depth:c.cbore_depth,at:(c.at==null||c.at==="center")?_atList(c.at):offAt(_atList(c.at))};
     const onRef=_faceRef(c.on,nameMap); if(onRef)h.on=onRef;
     out.push(h); addCut(c.name, 2*_atList(c.at).length); break; }
   case "draw_polygon": {
     const pts=(c.points||[]).map(p=>off(p[0],p[1]));
     for(let i=0;i<pts.length;i++){
       const a=pts[i], b=pts[(i+1)%pts.length];
       out.push({op:"draw_line",start:[a[0],a[1]],end:[b[0],b[1]]});
       if(sk)sk.ents.push(out.length-1);
     } break; }
   case "revolve_cut": { const ax=c.axis||"z"; ensureAxis(ax); _fixRevolvePlane(ax);
     out.push({op:"revolve_cut",axis:ax,...(c.angle!=null?{angle:c.angle}:{})}); addCut(c.name); pend=[]; break; }
   case "revolve": { const ax=c.axis||"z"; ensureAxis(ax); ensurePart(); _fixRevolvePlane(ax);
     out.push({op:"revolve",axis:ax,...(c.angle!=null?{angle:c.angle}:{})}); sawSolid=true; addBoss(c.name); pend=[]; break; }
   case "cosmetic_helix": {
     out.push({op:"helix_thread",diameter:c.diameter,pitch:c.pitch,length:c.length}); break; }
   case "note": notes.push(c.text||""); break;
   case "create_sketch": { ensurePart(); const cc=_clean(op,c); const fr=_faceRef(c.on,nameMap);
     if(fr&&fr.__plane){delete cc.on;cc.plane=fr.__plane;lastFaceSign=planeSign[fr.__plane]||null;}
     else if(fr){cc.on=fr;lastFaceSign=fr.facing[0];}
     else {delete cc.on;lastFaceSign=null;}
     if(cc.plane&&_PLANE_MAP[cc.plane])cc.plane=_PLANE_MAP[cc.plane][0];
     sk={outIdx:out.length,family:cc.on?({x:"right",y:"top",z:"front"})[cc.on.facing[1]]:( {front:"front",top:"top",right:"right"}[cc.plane]||null ),ents:[]};
     out.push(cc); pend=[]; break; }
   case "create_plane": { const cc=_clean(op,c);
     const m=_PLANE_MAP[cc.offset_from];
     if(m){cc.offset_from=m[0];cc.distance=(cc.distance||0)*m[1];}
     if(cc.name)planeSign[cc.name]=(cc.distance||0)>=0?"+":"-";
     out.push(cc); break; }
   case "draw_rectangle": { const cc=_clean(op,c);
     if(c.at){ // at = الزاوية الدنيا بإحداثيات زاوية-الصفيحة → مركز محرّك
       const cx=c.at.u+c.width/2-(plate?plate.w/2:0), cy=c.at.v+c.height/2-(plate?plate.h/2:0);
       cc.center=[cx,cy];
     }else if(cc.center)cc.center=off(cc.center[0],cc.center[1]);
     out.push(cc); pend.push(cc); if(sk)sk.ents.push(out.length-1); break; }
   case "draw_circle": { const cc=_clean(op,c);
     if(c.at){cc.center=off(c.at.u||0,c.at.v||0);}
     else if(cc.center)cc.center=off(cc.center[0],cc.center[1]);
     out.push(cc); pend.push(cc); if(sk)sk.ents.push(out.length-1); break; }
   case "hole": {
     if(c.through===false&&c.depth!=null&&(c.type==null||c.type==="simple")){
       // ثقب أعمى: hole المحرك ما فيها depth → sketch+circle+cut بعمق
       const fr2=_faceRef(c.on,nameMap);
       const rawC=(c.at==null||c.at==="center");
       const poss=rawC?_atList(c.at):offAt(_atList(c.at));
       for(const [px,py] of poss){
         out.push(fr2&&!fr2.__plane?{op:"create_sketch",on:fr2}:{op:"create_sketch",plane:"front"});
         out.push({op:"draw_circle",center:[px,py],diameter:c.diameter});
         const cc2={op:"cut_extrude",through_all:false,depth:c.depth};
         if(fr2&&fr2.facing&&fr2.facing[0]==="+")cc2.reverse=true;
         out.push(cc2); addCut(c.name);
       }
       break;
     }
     const cc=_clean(op,c);
     const rawCtr=(c.at==null||c.at==="center");
     cc.at=rawCtr?_atList(c.at):offAt(_atList(c.at));
     const fr=_faceRef(c.on,nameMap); if(fr&&!fr.__plane)cc.on=fr; else delete cc.on;
     out.push(cc);
     const perPos=(c.type==="counterbore"||c.type==="countersink")?2:1;
     addCut(c.name, perPos*cc.at.length); break; }
   case "circular_pattern": {
     const ax=c.axis||"z";
     out.push({op:"circular_pattern",features:[featName(c.of_feature)],axis:ax,count:c.count,
               ...(c.total_angle!=null?{total_angle:c.total_angle}:{}),
               ...(c.equal_spacing!=null?{equal_spacing:c.equal_spacing}:{})});
     break; }
   case "linear_pattern": {
     const lp={op:"linear_pattern",features:[featName(c.of_feature)],
               direction:_dir(c.direction)||"x",spacing:c.dx!=null?c.dx:c.spacing,count:c.nx!=null?c.nx:c.count};
     if(c.ny!=null&&c.ny>1)lp.direction2={direction:"y",spacing:c.dy,count:c.ny};
     out.push(lp); break; }
   case "chamfer": { const cc=_clean(op,c); cc.edges=_edgesClean(c.edges); out.push(cc); break; }
   case "fillet": { const cc=_clean(op,c); cc.edges=_edgesClean(c.edges); out.push(cc); break; }
   case "cut_extrude": { flushCutInflate(); const cc=_clean(op,c); if(lastFaceSign==="+"&&cc.reverse==null)cc.reverse=true; out.push(cc); addCut(c.name); pend=[]; break; }
   case "extrude": { out.push(_clean(op,c)); sawSolid=true; addBoss(c.name); pend=[]; break; }
   case "internal_ring_gear": { sawPart=true;
     const cc=_clean(op,c);
     if(cc.rim_outer_diameter==null&&c.outer_diameter!=null)cc.rim_outer_diameter=c.outer_diameter;
     out.push(cc); sawSolid=true; bossN++; plate=null; break; }
   case "sprocket_iso": { sawPart=true;
     const cc=_clean(op,c);
     if(cc.chain==null){ const p=c.chain_pitch||12.7;
       cc.chain = p<=9.6?"06B" : p<=12.8?"08B" : p<=16?"10B" : p<=19.1?"12B" : "16B"; }
     out.push(cc); sawSolid=true; bossN++; plate=null; break; }
   case "involute_spur_gear": { sawPart=true; // الماكرو يفتح مستنده المسمّى بنفسه
     out.push(_clean(op,c)); sawSolid=true; bossN++; plate=null; break; }
   case "insert_component": { const cc=_clean(op,c);
     if(cc.at&&!Array.isArray(cc.at))cc.at=[cc.at.x||0,cc.at.y||0,cc.at.z||0];
     if(cc.part)cc.part=String(cc.part).replace(/\.SLDPRT$/i,"");
     { const stem=String(cc.part||"comp");
       swTranslate._ic=swTranslate._ic||{}; swTranslate._ic[stem]=(swTranslate._ic[stem]||0)+1;
       comps.push(c.name||stem+"_"+swTranslate._ic[stem]); } // اسم النسخة بالتوأم
     out.push(cc); break; }
   case "mate": { const cc=_clean(op,c);
     if(cc.a==null&&comps.length)cc.a={component:comps[0],facing:"+z"};
     if(cc.b==null&&comps.length)cc.b={component:comps[comps.length>1?1:0],facing:"+z"};
     out.push(cc); break; }
   default: out.push(_clean(op,c));
  }
 }
 return {file:{schema_version:"0.5",commands:out}, notes};
}

const BI18N={
 ar:{send:"أرسل للسوليدوركس",checking:"جارٍ فحص الاتصال بالمحرّك…",
   on:b=>`✓ متصل بمحرّك صنايعي — الواجهة الخلفية: ${b}`,
   off:BRIDGE_SAME_ORIGIN
     ?'المحرّك غير شغّال. شغّله من PowerShell: <code>swpilot bridge --backend solidworks</code> ثم اضغط الزر.'
     :'للإرسال للسوليدوركس: شغّل من PowerShell <code>swpilot bridge --backend solidworks</code> ثم افتح <code>http://127.0.0.1:8765</code> بالمتصفح (بدل فتح الملف مباشرة).',
   mTitle:"تأكيد الإرسال للسوليدوركس",
   mSub:n=>`راجع الأوامر (${n}) اللي رح تتنفّذ. ما بينفّذ إشي إلا بعد تأكيدك.`,
   confirm:"✓ أكّد ونفّذ",cancel:"إلغاء",close:"إغلاق",
   sending:"جارٍ الإرسال…",executing:"جارٍ التنفيذ بالسوليدوركس…",
   okRun:b=>`🎉 تم التنفيذ بنجاح على الواجهة (${b})! افتح السوليدوركس وشوف القطعة.`,
   okMock:"✓ تم التنفيذ على الواجهة التجريبية (mock) — للتجربة على السوليدوركس شغّل الجسر بـ --backend solidworks",
   errValid:"❌ الأوامر مرفوضة من المحرّك:",
   errConn:"❌ انقطع الاتصال بالمحرّك — تأكد إنه <code>swpilot bridge</code> لسا شغّال.",
   errToken:"⏱ انتهت صلاحية التأكيد — أعد الإرسال من جديد.",
   errRun:"❌ فشل التنفيذ:"},
 en:{send:"Send to SolidWorks",checking:"Checking engine connection…",
   on:b=>`✓ Connected to Sanay3i engine — backend: ${b}`,
   off:BRIDGE_SAME_ORIGIN
     ?'Engine not running. Start it in PowerShell: <code>swpilot bridge --backend solidworks</code> then click the button.'
     :'To send to SolidWorks: run <code>swpilot bridge --backend solidworks</code> in PowerShell, then open <code>http://127.0.0.1:8765</code> in your browser (instead of opening the file directly).',
   mTitle:"Confirm — send to SolidWorks",
   mSub:n=>`Review the ${n} command(s) below. Nothing executes until you confirm.`,
   confirm:"✓ Confirm & run",cancel:"Cancel",close:"Close",
   sending:"Sending…",executing:"Executing in SolidWorks…",
   okRun:b=>`🎉 Executed successfully on the ${b} backend! Open SolidWorks to see the part.`,
   okMock:"✓ Executed on the mock backend — to drive SolidWorks, start the bridge with --backend solidworks",
   errValid:"❌ Commands rejected by the engine:",
   errConn:"❌ Lost connection to the engine — make sure <code>swpilot bridge</code> is still running.",
   errToken:"⏱ Confirmation expired — send again.",
   errRun:"❌ Execution failed:"}
};
const BT=()=>BI18N[lang]||BI18N.ar;

async function bridgeHealth(){
 const st=$("bridgeStatus");
 try{
   const r=await fetch(BRIDGE_BASE+"/v1/health",{signal:AbortSignal.timeout(2500)});
   if(!r.ok)throw 0;
   bridgeInfo=await r.json(); bridgeUp=true;
   st.className="bridgestatus ok"; st.innerHTML=BT().on(bridgeInfo.backend||"?");
   $("sendBtn").disabled=false;
 }catch(e){
   bridgeUp=false; bridgeInfo=null;
   st.className="bridgestatus off"; st.innerHTML=BT().off;
   $("sendBtn").disabled=false; /* stays clickable: clicking re-checks + explains */
 }
}

function bmodalShow(){$("bModal").style.display="flex";}
function bmodalHide(){$("bModal").style.display="none";$("bmResult").style.display="none";
 $("bmCmds").style.display="block";_pendingToken=null;
 $("bmConfirm").style.display="";$("bmConfirm").disabled=false;$("bmCancel").textContent=BT().cancel;}

async function bridgeSend(){
 // Re-check health first (cheap; covers "user just started the bridge")
 await bridgeHealth();
 const T=BT();
 if(!bridgeUp){ // show modal in "how to start" mode
   $("bmTitle").textContent=T.mTitle;
   $("bmSub").innerHTML=T.off;
   $("bmCmds").style.display="none";
   $("bmResult").style.display="none";
   $("bmConfirm").style.display="none";
   $("bmCancel").textContent=T.close;
   bmodalShow(); return;
 }
 // 1) PREVIEW: POST the CommandFile the catalog already generates
 $("bmTitle").textContent=T.mTitle;
 $("bmSub").textContent=T.sending;
 $("bmCmds").style.display="block"; $("bmCmds").innerHTML="…";
 $("bmResult").style.display="none";
 $("bmConfirm").style.display=""; $("bmConfirm").disabled=true;
 $("bmCancel").textContent=T.cancel;
 bmodalShow();
 let prev;
 const tr=swTranslate(cur.json(vals));
 try{
   const r=await fetch(BRIDGE_BASE+"/v1/commandfile",{method:"POST",
     headers:{"Content-Type":"application/json"},
     body:JSON.stringify(tr.file),signal:AbortSignal.timeout(8000)});
   const body=await r.json().catch(()=>({}));
   if(r.status===422){ // engine validation rejected it — show its exact message
     $("bmCmds").style.display="none";
     $("bmResult").className="bmodal-result err";
     $("bmResult").innerHTML=T.errValid+"<br><code style='font-size:11px'>"+(body.error||"?")+"</code>";
     $("bmResult").style.display="block";
     $("bmConfirm").style.display="none";$("bmCancel").textContent=T.close;return;
   }
   if(!r.ok)throw 0;
   prev=body;
 }catch(e){
   $("bmCmds").style.display="none";
   $("bmResult").className="bmodal-result err";
   $("bmResult").innerHTML=T.errConn;$("bmResult").style.display="block";
   $("bmConfirm").style.display="none";$("bmCancel").textContent=T.close;return;
 }
 // Render the engine's parsed preview (what will actually run)
 _pendingToken=prev.token;
 $("bmSub").textContent=T.mSub(prev.commands.length);
 let cmdsHtml=prev.commands.map(c=>{
   const ps=Object.entries(c.params||{}).filter(([k,v])=>v!=null)
     .map(([k,v])=>`${k}=${typeof v==="number"?+v.toFixed(2):JSON.stringify(v)}`).join(" · ");
   return `<div><span class="op">${c.op}</span> <span class="pv">${ps}</span></div>`;
 }).join("");
 if(tr.notes.length){
   cmdsHtml+=`<div style="margin-top:8px;color:var(--dim)">${lang==="ar"?"📝 ملاحظات (للقراءة فقط):":"📝 Notes (informational):"} ${tr.notes.map(n=>`<i>${n}</i>`).join(" · ")}</div>`;
 }
 $("bmCmds").innerHTML=cmdsHtml;
 $("bmConfirm").disabled=false;
}

async function bridgeConfirm(){
 const T=BT();
 if(!_pendingToken)return;
 $("bmConfirm").disabled=true;$("bmSub").textContent=T.executing;
 try{
   const r=await fetch(BRIDGE_BASE+"/v1/execute",{method:"POST",
     headers:{"Content-Type":"application/json"},
     body:JSON.stringify({token:_pendingToken}),signal:AbortSignal.timeout(120000)});
   const body=await r.json().catch(()=>({}));
   _pendingToken=null;
   $("bmCmds").style.display="none";
   if(r.status===404){ // expired / used token
     $("bmResult").className="bmodal-result err";
     $("bmResult").innerHTML=T.errToken;$("bmResult").style.display="block";
     $("bmConfirm").style.display="none";$("bmCancel").textContent=T.close;return;
   }
   if(!r.ok)throw 0;
   const rep=body.report||{};
   if(rep.success){
     $("bmResult").className="bmodal-result ok";
     $("bmResult").textContent=(rep.backend==="solidworks")?T.okRun(rep.backend):T.okMock;
   }else{
     const firstErr=(rep.results||[]).find(x=>x.status==="error");
     $("bmResult").className="bmodal-result err";
     $("bmResult").innerHTML=T.errRun+"<br><code style='font-size:11px'>"+
       ((firstErr&&(firstErr.error||firstErr.message))||"?")+"</code>";
   }
   $("bmResult").style.display="block";
   $("bmConfirm").style.display="none";$("bmCancel").textContent=T.close;
 }catch(e){
   $("bmCmds").style.display="none";
   $("bmResult").className="bmodal-result err";
   $("bmResult").innerHTML=T.errConn;$("bmResult").style.display="block";
   $("bmConfirm").style.display="none";$("bmCancel").textContent=T.close;
 }
}

$("sendBtn").onclick=bridgeSend;
$("bmConfirm").onclick=bridgeConfirm;
$("bmCancel").onclick=bmodalHide;
$("bModal").onclick=e=>{if(e.target.id==="bModal")bmodalHide();};

cur=allParts()[0];
if(typeof loadFromHash==="function"&&loadFromHash()){/* shared link */}
setLang("ar");
</script>
